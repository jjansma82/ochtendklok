<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Ochtendklok</title><style>
:root{--bg:#334155}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111827;font-family:Arial,sans-serif;color:white}.viewport{position:fixed;inset:0;background:var(--bg);overflow:hidden}.stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform-origin:center}.app{width:1600px;height:900px;padding:28px 42px;display:grid;grid-template-columns:650px 1fr;gap:38px;align-items:center}.left{display:flex;flex-direction:column;align-items:center}.clock{position:relative;width:530px;height:530px;border-radius:50%;background:#fff;border:13px solid #ffffff88;box-shadow:inset 0 0 0 8px #e5e7eb,0 24px 60px #0004;color:#172033}.num{position:absolute;font-size:34px;font-weight:900;transform:translate(-50%,-50%)}.tickwrap{position:absolute;inset:0}.tick{position:absolute;top:18px;left:50%;width:2px;height:11px;background:#94a3b8;transform:translateX(-50%)}.tick.major{top:14px;width:4px;height:19px;background:#334155}.hand{position:absolute;left:50%;bottom:50%;transform-origin:50% 100%;border-radius:20px}.hour{width:11px;height:25%;background:#172033}.minute{width:7px;height:35%;background:#334155}.second{width:3px;height:39%;background:#dc2626}.pin{position:absolute;left:50%;top:50%;width:25px;height:25px;border-radius:50%;background:#172033;border:4px solid white;transform:translate(-50%,-50%)}.date{font-size:32px;font-weight:900;margin-top:20px;text-transform:capitalize}.badge,.sound{margin-top:9px;font-size:17px;font-weight:800}.badge{padding:7px 13px;background:#0003;border-radius:30px}.panel{background:#0f172a38;border:1px solid #ffffff2e;border-radius:28px;padding:24px;box-shadow:0 20px 50px #0003}.right{display:grid;gap:15px}.eyebrow{font-size:15px;letter-spacing:3px;font-weight:900;color:#ffffffbb}.current{display:flex;align-items:center;gap:18px;margin:8px 0 18px}.current .icon{font-size:65px}.current h1{font-size:48px;line-height:1;margin:0}.current .time{font-size:21px;font-weight:800;color:#ffffffbb;margin-top:7px}.schedule{display:grid;gap:8px}.row{display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:10px;padding:11px 14px;border-radius:16px;background:#0f172a2e;font-size:20px;font-weight:900}.row.active{background:white;color:#172033}.row.done{opacity:.48}.row .tm{font-size:16px;opacity:.68}.people{display:grid;grid-template-columns:1fr 1fr;gap:15px}.person h2{font-size:29px;margin:0 0 12px}.person ul{list-style:none;margin:0;padding:0;display:grid;gap:7px}.person li{background:#0f172a29;border-radius:12px;padding:8px 12px;font-size:18px;font-weight:800}.person li:before{content:'• ';opacity:.7}.gym{float:right;font-size:12px;background:#ffffff2c;padding:5px 9px;border-radius:20px}.overlay{position:fixed;inset:0;z-index:20;background:#0f172ae8;display:flex;align-items:center;justify-content:center}.overlay[hidden]{display:none}.start{width:600px;background:white;color:#172033;text-align:center;padding:40px;border-radius:28px}.start h2{font-size:40px;margin:5px}.start p{font-size:20px}.start button{border:0;border-radius:15px;background:#2563eb;color:white;padding:15px 25px;font-size:21px;font-weight:900}.pulse .panel:first-child{animation:pulse .9s}@keyframes pulse{0%{box-shadow:0 0 0 0 #fff}100%{box-shadow:0 0 0 32px #ffffff00}}
</style></head><body><div class="overlay" id="overlay"><div class="start"><div style="font-size:60px">🔔</div><h2>Ochtendklok starten</h2><p>Klik eenmaal om de gong toe te staan.</p><button id="start">Start met geluid</button></div></div><div class="viewport"><div class="stage" id="stage"><main class="app"><section class="left"><div class="clock" id="clock"><div class="hand hour" id="hh"></div><div class="hand minute" id="mh"></div><div class="hand second" id="sh"></div><div class="pin"></div></div><div class="date" id="date"></div><div class="badge" id="demo" hidden></div><div class="sound" id="sound">🔇 Gong niet ingeschakeld</div></section><section class="right"><div class="panel"><div class="eyebrow">NU DOEN</div><div class="current"><div class="icon" id="ci"></div><div><h1 id="ct"></h1><div class="time" id="ctime"></div></div></div><div class="schedule" id="schedule"></div></div><div class="people"><div class="panel person"><h2>👦 Tijn <span class="gym" id="gym" hidden>GYMDAG</span></h2><ul id="tijn"></ul></div><div class="panel person"><h2>👧 Merte</h2><ul id="merte"></ul></div></div></section></main></div></div><script>
'use strict';const B=[['07:00','07:10','👕','Aankleden','#2563eb'],['07:10','07:30','🥣','Ontbijten','#16a34a'],['07:30','07:40','🍞','Broodbakje klaarmaken','#ca8a04'],['07:40','07:50','🪥','Tandenpoetsen, bril poetsen en gel in je haar','#ea580c'],['07:50','08:00','🎒','Klaarmaken voor vertrek','#dc2626']],T=['Schoon ondergoed & sokken','Tas ingepakt','Gymtas ingepakt','Gel in mijn haar'],M=['Schoon ondergoed & sokken','Tas ingepakt','Bril gepoetst en opgezet'],G=new Set(['07:10','07:30','07:40','07:50']),$=x=>document.getElementById(x);let ac=null,on=false,last='';const mins=t=>{let[a,b]=t.split(':').map(Number);return a*60+b};function scale(){let z=Math.min((innerWidth-24)/1600,(innerHeight-24)/900);$('stage').style.transform=`translate(-50%,-50%) scale(${z})`}function face(){for(let i=0;i<60;i++){let w=document.createElement('i'),t=document.createElement('i');w.className='tickwrap';w.style.transform=`rotate(${i*6}deg)`;t.className='tick '+(i%5?'':'major');w.append(t);$('clock').append(w)}for(let n=1;n<=12;n++){let a=n*30*Math.PI/180,e=document.createElement('b');e.className='num';e.textContent=n;e.style.left=50+Math.sin(a)*39+'%';e.style.top=50-Math.cos(a)*39+'%';$('clock').append(e)}}function demo(){let v=new URLSearchParams(location.search).get('demo');return /^([01]\d|2[0-3]):[0-5]\d$/.test(v||'')?v:null}function now(){let d=new Date(),v=demo();if(v){let[h,m]=v.split(':').map(Number);d.setHours(h,m,0,0)}return d}function gong(){if(!ac||ac.state!=='running')return;let s=ac.currentTime;[196,294,392].forEach((f,i)=>{let o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.setValueAtTime(.1/(i+1),s);g.gain.exponentialRampToValueAtTime(.0001,s+3);o.connect(g).connect(ac.destination);o.start(s);o.stop(s+3)});document.body.classList.add('pulse');setTimeout(()=>document.body.classList.remove('pulse'),1000)}$('start').onclick=async()=>{let A=window.AudioContext||window.webkitAudioContext;ac=new A;await ac.resume();on=true;$('overlay').hidden=true;$('sound').textContent='🔔 Gong ingeschakeld';gong()};function render(){let d=now(),n=d.getHours()*60+d.getMinutes(),a=B.findIndex(x=>n>=mins(x[0])&&n<mins(x[1])),b=B[a],v=demo();$('hh').style.transform=`translateX(-50%) rotate(${((d.getHours()%12)+d.getMinutes()/60)*30}deg)`;$('mh').style.transform=`translateX(-50%) rotate(${(d.getMinutes()+d.getSeconds()/60)*6}deg)`;$('sh').style.transform=`translateX(-50%) rotate(${d.getSeconds()*6}deg)`;$('date').textContent=d.toLocaleDateString('nl-NL',{weekday:'long',day:'numeric',month:'long'});$('demo').hidden=!v;$('demo').textContent=v?'🧪 Demostand: '+v:'';document.documentElement.style.setProperty('--bg',b?b[4]:'#334155');$('ci').textContent=b?b[2]:(n<420?'☀️':'✅');$('ct').textContent=b?(a===3?'Tanden, bril en haar':b[3]):(n<420?'Goedemorgen':'De ochtendroutine is klaar');$('ctime').textContent=b?b[0]+' tot '+b[1]:'';$('schedule').innerHTML=B.map((x,i)=>`<div class="row ${i===a?'active':i<a?'done':''}"><span>${i<a?'✓':x[2]}</span><span>${x[3]}</span><span class="tm">${x[0]} – ${x[1]}${i===a?' · NU':''}</span></div>`).join('');let gym=d.getDay()===2||d.getDay()===4;$('gym').hidden=!gym;$('tijn').innerHTML=T.filter(x=>x!=='Gymtas ingepakt'||gym).map(x=>'<li>'+x+'</li>').join('');$('merte').innerHTML=M.map(x=>'<li>'+x+'</li>').join('');let tm=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'),key=d.toDateString()+tm;if(on&&!v&&G.has(tm)&&key!==last){last=key;gong()}}addEventListener('resize',scale);addEventListener('orientationchange',scale);scale();face();render();setInterval(render,1000);
</script></body></html>
