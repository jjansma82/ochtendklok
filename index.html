<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ochtendklok</title>

<style>

html, body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    transition:background-color 1s ease;
}

.container{
    height:100%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}

.clock{
    width:min(70vw,70vh);
    height:min(70vw,70vh);
    border-radius:50%;
    background:white;
    position:relative;
    box-shadow:0 0 40px rgba(0,0,0,.25);
}

.number{
    position:absolute;
    font-size:2.2rem;
    font-weight:bold;
    color:#222;
    transform:translate(-50%,-50%);
}

.hand{
    position:absolute;
    left:50%;
    bottom:50%;
    transform-origin:bottom center;
}

.hour{
    width:10px;
    height:24%;
    background:#222;
    border-radius:20px;
}

.minute{
    width:6px;
    height:34%;
    background:#333;
    border-radius:20px;
}

.second{
    width:3px;
    height:38%;
    background:#d40000;
    border-radius:20px;
}

.center{
    position:absolute;
    left:50%;
    top:50%;
    width:20px;
    height:20px;
    background:#222;
    border-radius:50%;
    transform:translate(-50%,-50%);
}

.activity{
    margin-top:40px;
    font-size:4rem;
    font-weight:bold;
    color:white;
    text-align:center;
    text-shadow:0 3px 10px rgba(0,0,0,.25);
}

.time{
    margin-top:10px;
    font-size:2rem;
    color:white;
}

.schedule{
    position:absolute;
    top:20px;
    left:20px;
    color:white;
    font-size:1.2rem;
    line-height:1.8;
    background:rgba(255,255,255,.15);
    padding:15px 20px;
    border-radius:12px;
}

.current{
    font-weight:bold;
}

</style>
</head>
<body>

<div class="schedule" id="schedule"></div>

<div class="container">

    <div class="clock">

        <div class="number" style="left:50%;top:8%;">12</div>
        <div class="number" style="left:82%;top:18%;">1</div>
        <div class="number" style="left:92%;top:50%;">3</div>
        <div class="number" style="left:82%;top:82%;">5</div>
        <div class="number" style="left:50%;top:92%;">6</div>
        <div class="number" style="left:18%;top:82%;">7</div>
        <div class="number" style="left:8%;top:50%;">9</div>
        <div class="number" style="left:18%;top:18%;">11</div>

        <div id="hour" class="hand hour"></div>
        <div id="minute" class="hand minute"></div>
        <div id="second" class="hand second"></div>

        <div class="center"></div>

    </div>

    <div id="activity" class="activity"></div>
    <div id="digitalTime" class="time"></div>

</div>
