<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#334155">
  <title>Ochtendklok</title>
  <style>
    :root {
      --background: #334155;
      --panel: rgba(15, 23, 42, 0.27);
      --panel-border: rgba(255, 255, 255, 0.18);
      --white-muted: rgba(255, 255, 255, 0.75);
      --clock-size: min(65vh, 43vw);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      overflow: hidden;
      color: #fff;
      background: var(--background);
      font-family: Arial, Helvetica, sans-serif;
      transition: background-color 700ms ease;
    }

    button { font: inherit; }

    .app {
      min-height: 100vh;
      min-height: 100svh;
      padding: clamp(16px, 2vw, 36px);
      display: grid;
      grid-template-columns: minmax(420px, 0.92fr) minmax(620px, 1.08fr);
      gap: clamp(20px, 2.6vw, 52px);
      align-items: center;
    }

    .clock-column {
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .clock {
      position: relative;
      width: var(--clock-size);
      aspect-ratio: 1;
      flex: 0 0 auto;
      overflow: hidden;
      border: clamp(8px, 0.8vw, 14px) solid rgba(255, 255, 255, 0.52);
      border-radius: 50%;
      background: #fff;
      color: #172033;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.28), inset 0 0 0 8px #e5e7eb;
    }

    .tick-wrap {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .tick {
      position: absolute;
      top: 3.4%;
      left: 50%;
      width: 2px;
      height: 2.3%;
      border-radius: 4px;
      background: #94a3b8;
      transform: translateX(-50%);
    }

    .tick.major {
      top: 2.7%;
      width: 4px;
      height: 3.7%;
      background: #334155;
    }

    .number {
      position: absolute;
      z-index: 2;
      font-size: clamp(20px, 3.2vh, 40px);
      font-weight: 900;
      line-height: 1;
      transform: translate(-50%, -50%);
      user-select: none;
    }

    .hand {
      position: absolute;
      z-index: 5;
      bottom: 50%;
      left: 50%;
      border-radius: 999px;
      transform-origin: 50% 100%;
      will-change: transform;
    }

    .hour-hand {
      width: clamp(8px, 0.75vw, 13px);
      height: 25%;
      background: #172033;
    }

    .minute-hand {
      width: clamp(5px, 0.5vw, 9px);
      height: 35%;
      background: #334155;
    }

    .second-hand {
      width: 3px;
      height: 39%;
      background: #dc2626;
    }

    .clock-pin {
      position: absolute;
      z-index: 6;
      top: 50%;
      left: 50%;
      width: clamp(20px, 2.2vh, 28px);
      aspect-ratio: 1;
      border: 4px solid #fff;
      border-radius: 50%;
      background: #172033;
      transform: translate(-50%, -50%);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
    }

    .date {
      margin-top: 18px;
      font-size: clamp(20px, 2vw, 31px);
      font-weight: 800;
      text-align: center;
      text-transform: capitalize;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
    }

    .status-line {
      min-height: 24px;
      margin-top: 7px;
      color: var(--white-muted);
      font-size: clamp(14px, 1vw, 18px);
      font-weight: 700;
      text-align: center;
    }

    .demo-badge {
      display: inline-block;
      margin-top: 8px;
      padding: 7px 12px;
      border: 1px solid rgba(255, 255, 255, 0.28);
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.28);
      font-size: 15px;
      font-weight: 900;
    }

    .right-column {
      min-width: 0;
      display: grid;
      gap: 14px;
    }

    .panel {
      border: 1px solid var(--panel-border);
      border-radius: 28px;
      background: var(--panel);
      box-shadow: 0 20px 55px rgba(0, 0, 0, 0.17);
      backdrop-filter: blur(8px);
    }

    .routine-panel { padding: clamp(18px, 1.7vw, 30px); }

    .eyebrow {
      color: var(--white-muted);
      font-size: clamp(12px, 0.9vw, 15px);
      font-weight: 900;
      letter-spacing: 0.19em;
      text-transform: uppercase;
    }

    .current-task {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 16px;
      align-items: center;
      margin: 8px 0 18px;
    }

    .current-icon { font-size: clamp(46px, 4vw, 68px); }

    .current-title {
      margin: 0;
      font-size: clamp(30px, 3vw, 50px);
      font-weight: 900;
      line-height: 1.04;
    }

    .current-time {
      margin-top: 5px;
      color: var(--white-muted);
      font-size: clamp(17px, 1.3vw, 22px);
      font-weight: 800;
    }

    .schedule {
      display: grid;
      gap: 8px;
    }

    .schedule-row {
      display: grid;
      grid-template-columns: 38px 1fr auto;
      gap: 10px;
      align-items: center;
      min-width: 0;
      padding: 10px 13px;
      border: 2px solid transparent;
      border-radius: 16px;
      background: rgba(15, 23, 42, 0.18);
      color: rgba(255, 255, 255, 0.82);
    }

    .schedule-row.active {
      border-color: #fff;
      background: #fff;
      color: #172033;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.18);
    }

    .schedule-row.done { opacity: 0.48; }
    .schedule-icon { font-size: 24px; text-align: center; }
    .schedule-label { min-width: 0; font-size: clamp(16px, 1.2vw, 21px); font-weight: 900; line-height: 1.12; }
    .schedule-time { color: inherit; opacity: 0.68; font-size: clamp(13px, 0.95vw, 17px); font-weight: 800; white-space: nowrap; }

    .personal-lists {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .personal-card { padding: clamp(16px, 1.35vw, 24px); }

    .person-title {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 11px;
      font-size: clamp(22px, 1.7vw, 29px);
      font-weight: 900;
    }

    .gym-badge {
      margin-left: auto;
      padding: 5px 9px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.18);
      font-size: 11px;
      letter-spacing: 0.07em;
      text-transform: uppercase;
    }

    .personal-card ul {
      display: grid;
      gap: 7px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .personal-card li {
      position: relative;
      padding: 8px 10px 8px 31px;
      border-radius: 12px;
      background: rgba(15, 23, 42, 0.16);
      font-size: clamp(15px, 1.05vw, 18px);
      font-weight: 800;
      line-height: 1.18;
    }

    .personal-card li::before {
      content: "•";
      position: absolute;
      left: 13px;
      color: rgba(255, 255, 255, 0.72);
    }

    .start-overlay {
      position: fixed;
      z-index: 50;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(15, 23, 42, 0.86);
      backdrop-filter: blur(10px);
    }

    .start-overlay[hidden] { display: none; }

    .start-card {
      width: min(620px, 100%);
      padding: 38px;
      border-radius: 28px;
      background: #fff;
      color: #172033;
      text-align: center;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
    }

    .start-card .bell { font-size: 58px; }
    .start-card h2 { margin: 8px 0 10px; font-size: clamp(30px, 3vw, 42px); }
    .start-card p { margin: 0 0 22px; color: #475569; font-size: clamp(17px, 1.5vw, 21px); line-height: 1.45; }

    .start-button {
      padding: 15px 24px;
      border: 0;
      border-radius: 15px;
      background: #2563eb;
      color: #fff;
      font-size: 21px;
      font-weight: 900;
      cursor: pointer;
    }

    .gong-pulse .routine-panel {
      animation: gongPulse 900ms ease-out;
    }

    @keyframes gongPulse {
      0% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.95); }
      100% { box-shadow: 0 0 0 32px rgba(255, 255, 255, 0); }
    }

    @media (max-width: 1100px) {
      body { overflow: auto; }
      .app { grid-template-columns: 1fr; }
      .clock { width: min(64vh, 84vw); }
    }

    @media (max-width: 650px) {
      .personal-lists { grid-template-columns: 1fr; }
      .schedule-row { grid-template-columns: 34px 1fr; }
      .schedule-time { grid-column: 2; }
    }

    @media (min-width: 1101px) and (max-height: 760px) {
      :root { --clock-size: min(58vh, 41vw); }
      .app { padding: 12px 22px; gap: 24px; }
      .routine-panel { padding: 17px; }
      .current-task { margin: 5px 0 12px; }
      .schedule { gap: 5px; }
      .schedule-row { padding: 7px 11px; }
      .personal-card { padding: 13px 16px; }
      .personal-card li { padding-top: 5px; padding-bottom: 5px; }
    }
  </style>
</head>
<body>
  <div class="start-overlay" id="startOverlay">
    <div class="start-card">
      <div class="bell">🔔</div>
      <h2>Ochtendklok starten</h2>
      <p>Klik eenmaal om geluid toe te staan. Daarna klinkt een gong om 07:10, 07:30, 07:40 en 07:50.</p>
      <button class="start-button" id="startButton" type="button">Start met geluid</button>
    </div>
  </div>

  <main class="app">
    <section class="clock-column">
      <div class="clock" id="clock" aria-label="Analoge klok">
        <div class="hour-hand hand" id="hourHand"></div>
        <div class="minute-hand hand" id="minuteHand"></div>
        <div class="second-hand hand" id="secondHand"></div>
        <div class="clock-pin"></div>
      </div>
      <div class="date" id="date"></div>
      <div class="demo-badge" id="demoBadge" hidden></div>
      <div class="status-line" id="soundStatus">🔇 Gong nog niet ingeschakeld</div>
    </section>

    <section class="right-column">
      <section class="routine-panel panel">
        <div class="eyebrow">Nu doen</div>
        <div class="current-task">
          <div class="current-icon" id="currentIcon">☀️</div>
          <div>
            <h1 class="current-title" id="currentTitle">Goedemorgen</h1>
            <div class="current-time" id="currentTime"></div>
          </div>
        </div>
        <div class="schedule" id="schedule"></div>
      </section>

      <div class="personal-lists">
        <section class="personal-card panel">
          <h2 class="person-title">👦 Tijn <span class="gym-badge" id="gymBadge" hidden>Gymdag</span></h2>
          <ul id="tijnTasks"></ul>
        </section>
        <section class="personal-card panel">
          <h2 class="person-title">👧 Merte</h2>
          <ul id="merteTasks"></ul>
        </section>
      </div>
    </section>
  </main>

  <script>
    "use strict";

    const TIME_BLOCKS = [
      { start: "07:00", end: "07:10", icon: "👕", title: "Aankleden", color: "#2563eb" },
      { start: "07:10", end: "07:30", icon: "🥣", title: "Ontbijten", color: "#16a34a" },
      { start: "07:30", end: "07:40", icon: "🍞", title: "Broodbakje klaarmaken", color: "#ca8a04" },
      { start: "07:40", end: "07:50", icon: "🪥", title: "Tanden, bril en haar", detail: "Tandenpoetsen, bril poetsen en gel in je haar", color: "#ea580c" },
      { start: "07:50", end: "08:00", icon: "🎒", title: "Klaarmaken voor vertrek", color: "#dc2626" }
    ];

    const TIJN_TASKS = [
      "Schoon ondergoed & sokken",
      "Tas ingepakt",
      "Gymtas ingepakt",
      "Gel in mijn haar"
    ];

    const MERTE_TASKS = [
      "Schoon ondergoed & sokken",
      "Tas ingepakt",
      "Bril gepoetst en opgezet"
    ];

    const GONG_TIMES = new Set(["07:10", "07:30", "07:40", "07:50"]);
    const $ = (id) => document.getElementById(id);

    let audioContext = null;
    let soundEnabled = false;
    let lastGongKey = "";
    let pulseTimer = null;

    function minutesFromTime(value) {
      const [hours, minutes] = value.split(":").map(Number);
      return hours * 60 + minutes;
    }

    function paddedTime(date) {
      return `${String(date.getHours()).padStart(2, "0")}:${String(date.getMinutes()).padStart(2, "0")}`;
    }

    function getDemoTime() {
      const value = new URLSearchParams(window.location.search).get("demo");
      return /^([01]\d|2[0-3]):[0-5]\d$/.test(value || "") ? value : null;
    }

    function getDisplayDate() {
      const demoTime = getDemoTime();
      const date = new Date();
      if (demoTime) {
        const [hours, minutes] = demoTime.split(":").map(Number);
        date.setHours(hours, minutes, 0, 0);
      }
      return date;
    }

    function createClockFace() {
      const clock = $("clock");

      for (let index = 0; index < 60; index += 1) {
        const wrap = document.createElement("div");
        wrap.className = "tick-wrap";
        wrap.style.transform = `rotate(${index * 6}deg)`;

        const tick = document.createElement("span");
        tick.className = index % 5 === 0 ? "tick major" : "tick";
        wrap.appendChild(tick);
        clock.appendChild(wrap);
      }

      for (let number = 1; number <= 12; number += 1) {
        const angle = number * 30 * Math.PI / 180;
        const label = document.createElement("span");
        label.className = "number";
        label.textContent = String(number);
        label.style.left = `${50 + Math.sin(angle) * 39}%`;
        label.style.top = `${50 - Math.cos(angle) * 39}%`;
        clock.appendChild(label);
      }
    }

    function renderPersonalTasks(date) {
      const isGymDay = date.getDay() === 2 || date.getDay() === 4;
      const visibleTijnTasks = TIJN_TASKS.filter((task) => task !== "Gymtas ingepakt" || isGymDay);

      $("tijnTasks").innerHTML = visibleTijnTasks.map((task) => `<li>${task}</li>`).join("");
      $("merteTasks").innerHTML = MERTE_TASKS.map((task) => `<li>${task}</li>`).join("");
      $("gymBadge").hidden = !isGymDay;
    }

    function renderSchedule(activeIndex) {
      $("schedule").innerHTML = TIME_BLOCKS.map((block, index) => {
        const stateClass = index === activeIndex ? "active" : index < activeIndex ? "done" : "";
        const symbol = index < activeIndex ? "✓" : block.icon;
        const currentLabel = index === activeIndex ? " · NU" : "";
        const accessibleTitle = block.detail || block.title;

        return `
          <div class="schedule-row ${stateClass}" title="${accessibleTitle}">
            <div class="schedule-icon">${symbol}</div>
            <div class="schedule-label">${accessibleTitle}</div>
            <div class="schedule-time">${block.start} – ${block.end}${currentLabel}</div>
          </div>`;
      }).join("");
    }

    function playGong() {
      if (!audioContext || audioContext.state !== "running") return;

      const start = audioContext.currentTime;
      [196, 294, 392].forEach((frequency, index) => {
        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();

        oscillator.type = "sine";
        oscillator.frequency.setValueAtTime(frequency, start);
        oscillator.frequency.exponentialRampToValueAtTime(frequency * 0.985, start + 2.8);
        gain.gain.setValueAtTime(0.0001, start);
        gain.gain.exponentialRampToValueAtTime(0.12 / (index + 1), start + 0.035);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + 3);
        oscillator.connect(gain).connect(audioContext.destination);
        oscillator.start(start);
        oscillator.stop(start + 3.1);
      });

      document.body.classList.remove("gong-pulse");
      void document.body.offsetWidth;
      document.body.classList.add("gong-pulse");
      window.clearTimeout(pulseTimer);
      pulseTimer = window.setTimeout(() => document.body.classList.remove("gong-pulse"), 1000);
    }

    async function enableSound() {
      try {
        const BrowserAudioContext = window.AudioContext || window.webkitAudioContext;
        if (!BrowserAudioContext) throw new Error("Web Audio wordt niet ondersteund");
        audioContext = audioContext || new BrowserAudioContext();
        await audioContext.resume();
        soundEnabled = true;
        $("startOverlay").hidden = true;
        $("soundStatus").textContent = "🔔 Gong ingeschakeld";
        playGong();
      } catch (error) {
        $("soundStatus").textContent = "⚠️ Geluid wordt niet ondersteund door deze browser";
        $("startOverlay").hidden = true;
      }
    }

    function maybePlayScheduledGong(date) {
      if (!soundEnabled || getDemoTime()) return;

      const time = paddedTime(date);
      const key = `${date.getFullYear()}-${date.getMonth()}-${date.getDate()}-${time}`;
      if (GONG_TIMES.has(time) && key !== lastGongKey) {
        lastGongKey = key;
        playGong();
      }
    }

    function render() {
      const date = getDisplayDate();
      const totalMinutes = date.getHours() * 60 + date.getMinutes();
      const activeIndex = TIME_BLOCKS.findIndex((block) =>
        totalMinutes >= minutesFromTime(block.start) && totalMinutes < minutesFromTime(block.end)
      );
      const activeBlock = activeIndex >= 0 ? TIME_BLOCKS[activeIndex] : null;

      const hourAngle = ((date.getHours() % 12) + date.getMinutes() / 60 + date.getSeconds() / 3600) * 30;
      const minuteAngle = (date.getMinutes() + date.getSeconds() / 60) * 6;
      const secondAngle = date.getSeconds() * 6;

      $("hourHand").style.transform = `translateX(-50%) rotate(${hourAngle}deg)`;
      $("minuteHand").style.transform = `translateX(-50%) rotate(${minuteAngle}deg)`;
      $("secondHand").style.transform = `translateX(-50%) rotate(${secondAngle}deg)`;

      $("date").textContent = date.toLocaleDateString("nl-NL", {
        weekday: "long",
        day: "numeric",
        month: "long"
      });

      const demoTime = getDemoTime();
      $("demoBadge").hidden = !demoTime;
      $("demoBadge").textContent = demoTime ? `🧪 Demostand: ${demoTime}` : "";

      if (activeBlock) {
        document.documentElement.style.setProperty("--background", activeBlock.color);
        document.querySelector('meta[name="theme-color"]').setAttribute("content", activeBlock.color);
        $("currentIcon").textContent = activeBlock.icon;
        $("currentTitle").textContent = activeBlock.title;
        $("currentTime").textContent = `${activeBlock.start} tot ${activeBlock.end}`;
      } else {
        const beforeRoutine = totalMinutes < minutesFromTime("07:00");
        document.documentElement.style.setProperty("--background", "#334155");
        document.querySelector('meta[name="theme-color"]').setAttribute("content", "#334155");
        $("currentIcon").textContent = beforeRoutine ? "☀️" : "✅";
        $("currentTitle").textContent = beforeRoutine ? "Goedemorgen" : "De ochtendroutine is klaar";
        $("currentTime").textContent = "";
      }

      renderSchedule(activeIndex);
      renderPersonalTasks(date);
      maybePlayScheduledGong(date);
    }

    $("startButton").addEventListener("click", enableSound);
    document.addEventListener("keydown", (event) => {
      if (!soundEnabled && (event.key === "Enter" || event.key === " ")) {
        event.preventDefault();
        enableSound();
      }
    });

    createClockFace();
    render();
    window.setInterval(render, 1000);
  </script>
</body>
</html>
